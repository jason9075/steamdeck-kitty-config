# --- Hotkeys --- #

# window
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t launch --type=tab --cwd=current

# tabs (ctrl+shift+tab conflicts with Steam)
map f7 previous_tab
map f8 next_tab

# scroll up/down
map ctrl+u scroll_page_up
map ctrl+d scroll_page_down

# change font size
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0


# --- Config --- #

# Font
font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold
bold_italic_font Hack Nerd Font Mono Bold Italic
italic_font      Hack Nerd Font Mono Italic

# to avoid typing special character in MacOS
macos_option_as_alt yes

font_size 14.0

# integration
shell_integration enabled


# --- Colors --- #

# Nightfox colors for Kitty
## name: nordfox
## upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/nordfox/kitty.conf

background #2e3440
foreground #cdcecf
selection_background #3e4a5b
selection_foreground #cdcecf
url_color #a3be8c
cursor #cdcecf

# Tabs
active_tab_background #81a1c1
active_tab_foreground #232831
inactive_tab_background #3e4a5b
inactive_tab_foreground #60728a

# normal
color0 #3b4252
color1 #bf616a
color2 #a3be8c
color3 #ebcb8b
color4 #81a1c1
color5 #b48ead
color6 #88c0d0
color7 #e5e9f0

# bright
color8 #465780
color9 #d06f79
color10 #b1d196
color11 #f0d399
color12 #8cafd2
color13 #c895bf
color14 #93ccdc
color15 #e7ecf4

# extended colors
color16 #c9826b
color17 #bf88bc

# SteamOS: use the accelerated XWayland path; the bundled Wayland/EGL backend fails on SteamOS.
linux_display_server x11

# Always start in the home directory
startup_session startup.session

# Gaming Mode: Steam preloads both 32- and 64-bit overlay libs, so every 64-bit
# program in the shell prints an ld.so "wrong ELF class" error. Drop it for children.
env LD_PRELOAD

# Gaming Mode on-screen keyboard covers the bottom of the screen: lift content above it / restore.
# Padding is in pt (1pt = 1.33px at 96 dpi). Tweak 260 if the keyboard still overlaps.
map ctrl+shift+f11 remote_control set-spacing --all padding-bottom=260
map ctrl+shift+f12 remote_control set-spacing --all padding-bottom=default
